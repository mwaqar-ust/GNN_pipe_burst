name: Tutorial CPU checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  notebook:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v4
        with:
          activate-environment: iahr-gnn-hkust-tutorial
          environment-file: environment.yml
          auto-activate: false
          miniforge-version: latest
      - name: Install dependencies and CPU PyTorch
        run: |
          python -m pip install -r requirements.txt
          python scripts/install_torch.py --cpu
          python -m ipykernel install --user --name iahr-gnn-hkust-tutorial --display-name "Python (IAHR GNN HKUST Tutorial)"
          python scripts/check_environment.py
      - name: Check graph, model, signals and setup logic
        run: python -m unittest discover -s tests -v
      - name: Execute the prepared notebook
        run: python scripts/check_notebook.py
