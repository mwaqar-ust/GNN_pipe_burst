name: Prepare uploaded tutorial archive
on:
  push:
    branches:
      - codex/import-tutorial-files
    paths:
      - .github/workflows/prepare-tutorial-import.yml
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify uploaded ZIP and list its contents
        run: |
          python - <<'PY'
          import hashlib
          import zipfile
          from pathlib import Path
          path = Path("IAHR_GNN_HKUST_Tutorial.zip")
          data = path.read_bytes()
          actual = hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()
          assert actual == "45b1e00f32b963e3c9fe65db389c661fd1bb5b4b", "Uploaded archive changed"
          with zipfile.ZipFile(path) as archive:
              assert archive.testzip() is None, "ZIP checksum failed"
              print("Archive verified. No project code is executed.")
              for item in archive.infolist():
                  if not item.is_dir():
                      print(item.filename, item.file_size)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: uploaded-tutorial-source
          path: IAHR_GNN_HKUST_Tutorial.zip
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
